<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>仲园 Agent｜校园资料问答</title>
    <style>
        /* 设计令牌与 agent/frontend/src/style.css 保持同源（绿色系、跟随系统明暗），
           两端界面共用一套取值，避免出现"两个产品"的观感。 */
        :root {
            color-scheme: light dark;
            --brand: #0f6e56;
            --on-brand: #ffffff;
            --page-bg: #f7f7f4;
            --surface: #ffffff;
            --text-primary: #213547;
            --text-secondary: #5f5e5a;
            --border-subtle: rgba(0, 0, 0, .1);
            --warning: #ba7517;
            --warning-bg: rgba(186, 117, 23, .1);
            --citation-bg: rgba(15, 110, 86, .06);
            --shadow-card: 0 1px 3px rgba(0, 0, 0, .08);
            --shadow-card-hover: 0 8px 24px rgba(15, 110, 86, .15);
            --radius-card: 12px;
            --radius-inner: 8px;
            --duration: 200ms;
            --font-sans: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --brand: #5dcaa5;
                /* 暗色下品牌色是浅绿，白字对比不足；用深色前景色保证按钮文字可读 */
                --on-brand: #0d2a22;
                --page-bg: #1c1c1a;
                --surface: #262624;
                --text-primary: rgba(255, 255, 255, .87);
                --text-secondary: #b4b2a9;
                --border-subtle: rgba(255, 255, 255, .12);
                --warning: #ef9f27;
                --warning-bg: rgba(239, 159, 39, .12);
                --citation-bg: rgba(93, 202, 165, .08);
                --shadow-card: 0 1px 3px rgba(0, 0, 0, .4);
                --shadow-card-hover: 0 8px 24px rgba(0, 0, 0, .5);
            }
        }
        * { box-sizing: border-box; }
        body { margin: 0; color: var(--text-primary); background: var(--page-bg); font-family: var(--font-sans); line-height: 1.6; }
        .page-shell { width: min(880px, calc(100% - 32px)); margin: 0 auto; padding: 40px 0 64px; }
        .muted { color: var(--text-secondary); }
        .card { padding: 24px; border: 1px solid var(--border-subtle); border-radius: var(--radius-card); background: var(--surface); box-shadow: var(--shadow-card); }
        .card + .card, .stack > * + * { margin-top: 20px; }
        .brand-row, .row-between { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
        .brand { margin: 0; font-size: 15px; font-weight: 500; letter-spacing: .02em; }
        .badge { margin: 0; padding: 4px 10px; border-radius: 999px; color: var(--brand); background: var(--citation-bg); font-size: 12px; font-weight: 500; }
        h1 { margin: 18px 0 8px; font-size: 2rem; font-weight: 500; letter-spacing: -.01em; }
        h2 { margin: 0; font-size: 1.05rem; font-weight: 500; }
        .intro { max-width: 60ch; margin: 0; color: var(--text-secondary); }
        .topic-list { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 0; padding: 0; list-style: none; }
        .topic-list li { padding: 4px 10px; border: 1px solid var(--border-subtle); border-radius: 999px; color: var(--text-secondary); font-size: 13px; }
        label { display: block; margin-bottom: 10px; font-weight: 500; }
        textarea { width: 100%; min-height: 112px; resize: vertical; padding: 14px; border: 1px solid var(--border-subtle); border-radius: var(--radius-inner); color: var(--text-primary); background: var(--surface); font: inherit; line-height: 1.65; }
        textarea::placeholder { color: var(--text-secondary); }
        textarea:focus-visible, button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
        .field-hint { margin: 10px 0 0; color: var(--text-secondary); font-size: 13px; }
        .example-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
        .example-question { border: 1px solid var(--border-subtle); border-radius: 999px; padding: 6px 12px; color: var(--text-secondary); background: var(--surface); font: inherit; font-size: 13px; cursor: pointer; transition: border-color var(--duration), color var(--duration); }
        .example-question:hover { border-color: var(--brand); color: var(--brand); }
        button { border: 0; border-radius: var(--radius-inner); padding: 10px 18px; color: var(--on-brand); background: var(--brand); font: inherit; font-weight: 500; cursor: pointer; transition: opacity var(--duration); }
        button:hover:not(:disabled) { opacity: .88; }
        button:disabled { cursor: wait; opacity: .6; }
        button.ghost { color: var(--text-secondary); background: transparent; border: 1px solid var(--border-subtle); }
        button.ghost:hover:not(:disabled) { border-color: var(--brand); color: var(--brand); }
        .message { margin: 16px 0 0; padding: 12px 14px; border-radius: var(--radius-inner); }
        .question-error, .service-error { color: var(--warning); background: var(--warning-bg); }
        .answer-status { margin: 0; padding: 5px 10px; border-radius: 999px; color: var(--brand); background: var(--citation-bg); font-size: 13px; font-weight: 500; }
        .answer-content { margin: 16px 0 0; line-height: 1.9; white-space: pre-wrap; }
        /* 引用卡：不放整段资料正文，只给"标题 + 定位 + 页码"，学生按定位自行核对原文。
           编号与 citationIds 顺序恒等，故用序号做锚点、原样透传不透明 ID。 */
        .citation-panel { margin-top: 20px; padding: 16px; border: 1px solid var(--border-subtle); border-radius: var(--radius-inner); background: var(--citation-bg); }
        .citation-heading { margin: 0; color: var(--text-primary); font-size: 14px; font-weight: 500; }
        .citation-list { display: grid; gap: 10px; margin: 12px 0 0; padding: 0; list-style: none; }
        .citation-item { display: flex; gap: 10px; align-items: baseline; }
        .citation-index { flex: none; color: var(--brand); font-size: 13px; font-weight: 500; }
        .citation-title { font-weight: 500; }
        .citation-locator { color: var(--text-secondary); font-size: 13px; }
        /* 转人工提示只在后端确实要求 handoff 时出现（数据驱动），不做常驻免责声明 */
        .handoff { margin: 16px 0 0; padding: 12px 14px; border-left: 3px solid var(--warning); border-radius: 0 var(--radius-inner) var(--radius-inner) 0; color: var(--warning); background: var(--warning-bg); font-size: 14px; }
        [hidden] { display: none !important; }
        @media (max-width: 560px) {
            .page-shell { width: min(100% - 24px, 880px); padding-top: 20px; }
            .card { padding: 18px; }
            h1 { font-size: 1.6rem; }
            button[type="submit"] { width: 100%; }
        }
    </style>
</head>
<body>
<main class="page-shell">
    <div class="stack">
        <header class="card">
            <div class="brand-row"><p class="brand">仲园 Agent</p><p class="badge">本机演示</p></div>
            <h1>校园资料问答</h1>
            <p class="intro">回答只取自已发布且仍在有效期内的校园资料，每条结论都可追溯到具体出处。</p>
            <ul class="topic-list">
                <li>选修课重修</li>
                <li>公共选修课学分上限</li>
            </ul>
        </header>

        <section class="card" aria-labelledby="question-title">
            <div class="row-between"><h2 id="question-title">提出你的问题</h2><button id="new-conversation" class="ghost" type="button">开始新对话</button></div>
            <form id="question-form">
                <label for="question-input">校园问题</label>
                <textarea id="question-input" maxlength="500" placeholder="例如：公共选修课每学期最多可以选多少学分？"></textarea>
                <p class="field-hint">输入 1 至 500 个字符。按回车发送，Shift + 回车换行。</p>
                <div class="example-list" aria-label="示例问题">
                    <button class="example-question" type="button" data-question="选修课没及格，还能重修吗？">选修课没及格还能重修吗？</button>
                    <button class="example-question" type="button" data-question="公共选修课不及格能重修吗？">公共选修课不及格能重修吗？</button>
                    <button class="example-question" type="button" data-question="公共选修课每学期最多可以选多少学分？">公共选修课每学期最多可以选多少学分？</button>
                </div>
                <div class="row-between" style="margin-top:18px">
                    <span class="field-hint" style="margin:0">会话失效后可点「开始新对话」。</span>
                    <button id="submit-question" type="submit">发送问题</button>
                </div>
                <p id="question-error" class="message question-error" role="alert" hidden></p>
            </form>
        </section>

        <p id="service-error" class="message service-error" role="alert" hidden></p>

        <section id="answer-panel" class="card" aria-live="polite" hidden>
            <div class="row-between"><p id="answer-status" class="answer-status"></p><p id="answer-conversation" class="field-hint" style="margin:0"></p></div>
            <p id="answer-content" class="answer-content"></p>
            <section id="citation-panel" hidden aria-labelledby="citation-title">
                <div class="citation-panel">
                    <div class="row-between"><h2 id="citation-title" class="citation-heading">资料依据</h2><span class="badge">可追溯</span></div>
                    <ol id="citation-list" class="citation-list"></ol>
                </div>
            </section>
            <p id="handoff-notice" class="handoff" hidden></p>
        </section>
    </div>
</main>
<script>
    const conversationApi = "/api/zhku/local-preview/conversations";
    const conversationStorageKey = "zhku.local-preview.conversation";
    const questionForm = document.querySelector("#question-form");
    const questionInput = document.querySelector("#question-input");
    const submitButton = document.querySelector("#submit-question");
    const newConversationButton = document.querySelector("#new-conversation");
    const questionError = document.querySelector("#question-error");
    const serviceError = document.querySelector("#service-error");
    const answerPanel = document.querySelector("#answer-panel");
    const answerStatus = document.querySelector("#answer-status");
    const answerContent = document.querySelector("#answer-content");
    const citationPanel = document.querySelector("#citation-panel");
    const citationList = document.querySelector("#citation-list");
    const handoffNotice = document.querySelector("#handoff-notice");
    // 传输层：会话消息用同一资源地址按 Accept 协商为 SSE（状态板 §八 第 4 条：事件顺序固定
    // accepted → reply → complete，reply/complete 载荷与同步响应同形）。服务端未开启流式通道时
    // 返回 503 而非回落 JSON，所以前端不能把一次性 JSON 当长连接，只能按"服务不可用"提示。
    const streamAccept = "text/event-stream";
    let sessionId = readStoredConversation().sessionId;
    let requestEpoch = 0;
    let activeStream = null;

    // 路由结论 → 面向学生的状态标签。理由：五级路由是可信边界的对外表达，
    // 学生需要知道"这条结论是当期通知、规则还是检索资料"，而不是只看到一句答案。
    const routeLabels = {
        AWAITING_CLARIFICATION: "需要补充信息",
        CURRENT_NOTICE: "当期通知",
        HIGH_RISK_RULE: "规则依据",
        RETRIEVAL_AUGMENTED: "资料检索",
        INSUFFICIENT_EVIDENCE: "证据不足"
    };
    const handoffText = "这条问题需要人工确认，请通过学校官方渠道核实后再办理。";

    restorePendingClarification();
    if (!sessionId) { void createConversationOnLoad(); }
    document.querySelectorAll(".example-question").forEach(button => button.addEventListener("click", () => { questionInput.value = button.dataset.question; questionForm.requestSubmit(); }));
    questionInput.addEventListener("keydown", event => { if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); questionForm.requestSubmit(); } });
    newConversationButton.addEventListener("click", startNewConversation);
    questionForm.addEventListener("submit", sendMessage);

    async function createConversationOnLoad() {
        const expectedEpoch = ++requestEpoch;
        try {
            await ensureConversation(expectedEpoch);
        } catch (error) {
            // 首屏建会话失败不阻塞输入；用户发送时会重试并获得明确的服务错误提示。
            if (expectedEpoch === requestEpoch) { sessionId = null; }
        }
    }

    async function sendMessage(event) {
        event.preventDefault();
        const message = questionInput.value.trim();
        resetMessages();
        if (message.length < 1 || message.length > 500) { showQuestionError("请输入 1 至 500 个字符的问题。"); return; }
        const expectedEpoch = ++requestEpoch;
        setLoading(true);
        try {
            await ensureConversation(expectedEpoch);
            if (expectedEpoch !== requestEpoch) { return; }
            const reply = await streamReply(expectedEpoch, message);
            if (expectedEpoch !== requestEpoch) { return; }
            renderReply(reply);
            questionInput.value = "";
        } catch (error) {
            if (expectedEpoch !== requestEpoch) { return; }
            if (error instanceof MessageRejectedError) { showQuestionError(error.message); return; }
            showServiceError();
        } finally {
            if (expectedEpoch === requestEpoch) { setLoading(false); }
        }
    }

    /**
     * 读取一轮流式作答。
     *
     * 事件顺序由服务端固定为 accepted → reply → complete，所以"生成中"反馈只依赖 accepted、
     * 业务渲染只依赖 reply/complete 的载荷：同步与流式共用 renderReply，避免同一消息在两种
     * 传输方式下给出不同结论（这是契约要求，也是不在此处二次加工字段的原因）。
     */
    async function streamReply(expectedEpoch, message) {
        abortActiveStream();
        const controller = new AbortController();
        activeStream = controller;
        // 请求体必须是对象（{message}），不是裸字符串：服务端按 DTO 绑定，发送裸字符串会得 400。
        const response = await fetch(`${conversationApi}/${sessionId}/messages`, streamRequestOptions({ message }, controller.signal));
        if (response.status === 400) {
            const payload = await readPayload(response);
            throw new MessageRejectedError(payload.message || "问题格式不正确，请检查后重试。");
        }
        if (!response.ok || !response.body) { throw new Error("stream-unavailable"); }
        // 内容协商回了 JSON（服务端未按流式应答）时按同步载荷渲染，页面不至于整体不可用；
        // 这与"把一次性 JSON 误当长连接"是相反方向的兼容，不违反契约。
        if (!isEventStream(response)) { return await readPayload(response); }
        let reply = null;
        await readEventStream(response, (name, payload) => {
            if (expectedEpoch !== requestEpoch || !payload) { return; }
            if (name === "accepted") { showPending(); return; }
            // reply 与 complete 载荷同形（服务端约定），后到的 complete 收敛为最终态。
            if (name === "reply" || name === "complete") { reply = payload; }
        });
        // 流结束却没有答复事件：宁可报服务不可用，也不能把空载荷当成"无依据"结论渲染出去。
        if (!reply) { throw new Error("stream-incomplete"); }
        return reply;
    }

    /**
     * 手工解析 SSE 帧：EventSource 只能发 GET，而会话消息是 POST，所以必须自己读流。
     * 帧以空行分隔、data 可跨行，CRLF 与 LF 都要兼容（容器与代理的行为不一致）。
     */
    async function readEventStream(response, onEvent) {
        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let buffer = "";
        try {
            while (true) {
                const { value, done } = await reader.read();
                if (done) { break; }
                buffer = (buffer + decoder.decode(value, { stream: true })).replace(/\r\n/g, "\n");
                let boundary = buffer.indexOf("\n\n");
                while (boundary !== -1) {
                    dispatchFrame(buffer.slice(0, boundary), onEvent);
                    buffer = buffer.slice(boundary + 2);
                    boundary = buffer.indexOf("\n\n");
                }
            }
            // 流可能不带结尾空行就结束：残留内容仍是一整帧，直接丢弃会静默丢掉答案。
            const tail = (buffer + decoder.decode()).trim();
            if (tail) { dispatchFrame(tail, onEvent); }
        } finally {
            reader.cancel().catch(() => {});
        }
    }

    function dispatchFrame(frame, onEvent) {
        let name = "message";
        const dataLines = [];
        for (const line of frame.split("\n")) {
            if (!line || line.startsWith(":")) { continue; }  // 空行与注释（心跳）不参与解析
            if (line.startsWith("event:")) { name = line.slice(6).trim(); continue; }
            if (line.startsWith("data:")) { dataLines.push(line.slice(5).replace(/^ /, "")); }
        }
        if (dataLines.length === 0) { return; }
        let payload = null;
        try { payload = JSON.parse(dataLines.join("\n")); } catch (error) { payload = null; }
        onEvent(name, payload);
    }

    // accepted 只代表服务端接单（作答字段为空）：先给出"生成中"反馈，避免模型往返期间界面静止。
    function showPending() {
        answerPanel.dataset.mode = "PENDING";
        answerStatus.textContent = "正在生成";
        answerContent.textContent = "正在核对校园资料并生成回答…";
        clearCitations();
        handoffNotice.hidden = true;
        answerPanel.hidden = false;
    }

    async function startNewConversation() {
        const expectedEpoch = ++requestEpoch;
        setLoading(true);
        try {
            const previousSessionId = sessionId;
            abortActiveStream();
            clearStoredConversation();
            sessionId = null;
            resetMessages();
            // 新会话必须等待旧会话取消完成，版本令牌同时隔离旧请求的晚到响应。
            if (previousSessionId) {
                const cancellation = await fetch(`${conversationApi}/${previousSessionId}/cancel`, requestOptions());
                if (!cancellation.ok) { throw new Error("conversation-cancel-failed"); }
            }
            if (expectedEpoch !== requestEpoch) { return; }
            await ensureConversation(expectedEpoch);
            if (expectedEpoch === requestEpoch) { renderClarification("已开始新对话。请描述你想确认的问题。"); }
        } catch (error) {
            if (expectedEpoch === requestEpoch) { showServiceError(); }
        } finally {
            if (expectedEpoch === requestEpoch) { setLoading(false); }
        }
    }

    async function ensureConversation(expectedEpoch) {
        if (sessionId) { return; }
        const response = await fetch(conversationApi, requestOptions());
        const payload = await readPayload(response);
        if (expectedEpoch !== requestEpoch) { return; }
        if (!response.ok || typeof payload.sessionId !== "string") { throw new Error("conversation-create-failed"); }
        sessionId = payload.sessionId;
        storeConversation({ sessionId, pendingPrompt: null });
    }

    function renderReply(payload) {
        const route = typeof payload.route === "string" ? payload.route : null;
        // 转人工只看 route/handoffRequired（冻结契约要求），不看旧字段 type——
        // 旧值 OUT_OF_SCOPE 在新链路里同时承载"范围外"与"证据不足"两种结论。
        const needsHandoff = payload.handoffRequired === true || route === "INSUFFICIENT_EVIDENCE";
        if (route) { answerStatus.textContent = routeLabels[route] || "回答"; }
        // 旧路径（无 route 字段）保留原有状态文案：后端已区分"资料缺失"与"通知过期"等原因，
        // 前端覆盖原文会掩盖治理状态，学生无法判断该等新通知还是改走官方渠道。
        if (payload.type === "EVIDENCE_UNAVAILABLE") {
            renderOutOfScope(payload.message || "当前没有可确认的有效依据，无法给出确定性结论。", "当前暂无有效通知", true);
            return;
        }
        if (needsHandoff) {
            renderOutOfScope(payload.message || "当前没有可确认的有效依据，无法给出确定性结论。", route ? routeLabels[route] : "需要人工确认", true);
            return;
        }
        if (route === "AWAITING_CLARIFICATION" || payload.type === "NEED_CLARIFICATION") { renderClarification(payload.message); return; }
        if (payload.type === "SESSION_INVALID" || payload.type === "SESSION_EXPIRED" || payload.type === "SESSION_CANCELLED") {
            sessionId = null;
            clearStoredConversation();
            renderClarification("当前会话已失效，请点击「开始新对话」后重试。");
            return;
        }
        if (route === "RETRIEVAL_AUGMENTED" || Array.isArray(payload.citations) && payload.citations.length > 0) {
            renderRetrieved(payload);
            return;
        }
        if (isAnswer(payload.answer)) { renderStructuredAnswer(payload.answer, route); return; }
        if (payload.type === "ANSWER" && typeof payload.message === "string") {
            answerPanel.dataset.mode = "ANSWER";
            if (!route) { answerStatus.textContent = "结论"; }
            answerContent.textContent = payload.message;
            answerPanel.hidden = false;
            storeConversation({ sessionId, pendingPrompt: null });
            return;
        }
        if (payload.type === "EVIDENCE_UNAVAILABLE") { renderOutOfScope(payload.message || "当前没有可确认的有效依据，无法给出确定性结论。", "当前暂无有效通知", true); return; }
        if (payload.type === "OUT_OF_SCOPE") { renderOutOfScope(payload.message || "网络公共选修课的具体限制暂未纳入本机演示范围，请以当期选课通知为准。", "范围外", false); return; }
        showServiceError();
    }

    function isAnswer(answer) { return answer && typeof answer.conclusion === "string" && typeof answer.basis === "string" && typeof answer.sourceId === "string" && typeof answer.sourceTitle === "string" && typeof answer.sourceVersion === "string" && typeof answer.sourceLocator === "string" && typeof answer.applicableScope === "string"; }

    function renderClarification(message) {
        answerPanel.dataset.mode = "NEED_CLARIFICATION";
        if (!answerStatus.textContent) { answerStatus.textContent = routeLabels.AWAITING_CLARIFICATION; }
        answerContent.textContent = message;
        clearCitations();
        answerPanel.hidden = false;
        storeConversation({ sessionId, pendingPrompt: message });
    }

    // 检索增强级：正文来自 message，依据来自 citations[]（标题 + 定位 + 页码）。
    // 缺口登记：当前 SSE 事件尚未下发 citations[] 明细（状态板 §八 第 4 条），此时引用卡
    // 自动不渲染——不补占位假数据；线 B 补齐明细后本函数无需改动即生效。
    function renderRetrieved(payload) {
        answerPanel.dataset.mode = "ANSWER";
        answerStatus.textContent = routeLabels.RETRIEVAL_AUGMENTED;
        answerContent.textContent = payload.message || "";
        renderCitations(payload.citations);
        answerPanel.hidden = false;
        storeConversation({ sessionId, pendingPrompt: null });
    }

    // 当期通知 / 规则级：沿用既有回答卡结构（结论 + 依据 + 适用范围 + 来源）。
    function renderStructuredAnswer(answer, route) {
        answerPanel.dataset.mode = "ANSWER";
        answerStatus.textContent = route ? (routeLabels[route] || "结论") : "结论与资料依据";
        answerContent.textContent = `结论：${answer.conclusion}\n\n依据：${answer.basis}\n\n适用范围：${answer.applicableScope}`;
        renderCitations([{ citationId: answer.sourceId, sourceTitle: answer.sourceTitle, sourceLocator: `${answer.sourceLocator}｜${answer.sourceVersion}` }]);
        answerPanel.hidden = false;
        storeConversation({ sessionId, pendingPrompt: null });
    }

    function renderOutOfScope(message, status, needsHandoff) {
        answerPanel.dataset.mode = "OUT_OF_SCOPE";
        answerStatus.textContent = status;
        answerContent.textContent = message;
        clearCitations();
        // 只有后端确实要求转人工时才提示官方渠道：这是信息而非常驻免责声明。
        handoffNotice.textContent = handoffText;
        handoffNotice.hidden = !needsHandoff;
        answerPanel.hidden = false;
        storeConversation({ sessionId, pendingPrompt: null });
    }

    function renderCitations(citations) {
        citationList.replaceChildren();
        const items = Array.isArray(citations) ? citations : [];
        let index = 0;
        for (const citation of items) {
            if (!citation || typeof citation.sourceTitle !== "string") { continue; }
            index += 1;
            const item = document.createElement("li");
            item.className = "citation-item";
            item.id = `cite-${index}`;
            // 不透明引用 ID 原样透传（契约要求前端不解析其含义），仅作锚点/排查用。
            if (typeof citation.citationId === "string") { item.dataset.citationId = citation.citationId; }
            const indexLabel = document.createElement("span");
            indexLabel.className = "citation-index";
            indexLabel.textContent = `[${index}]`;
            const body = document.createElement("div");
            const title = document.createElement("div");
            title.className = "citation-title";
            title.textContent = citation.sourceTitle;
            const locator = document.createElement("div");
            locator.className = "citation-locator";
            locator.textContent = [citation.sourceLocator, citation.pageNumber ? `第 ${citation.pageNumber} 页` : null].filter(Boolean).join(" · ");
            body.append(title);
            if (locator.textContent) { body.append(locator); }
            item.append(indexLabel, body);
            citationList.append(item);
        }
        citationPanel.hidden = items.length === 0;
    }

    function clearCitations() { citationList.replaceChildren(); citationPanel.hidden = true; }
    function resetMessages() { questionError.hidden = true; questionError.textContent = ""; serviceError.hidden = true; serviceError.textContent = ""; answerPanel.hidden = true; answerPanel.dataset.mode = ""; answerStatus.textContent = ""; answerContent.textContent = ""; handoffNotice.hidden = true; clearCitations(); }
    function showQuestionError(message) { questionError.textContent = message; questionError.hidden = false; }
    function showServiceError() { serviceError.textContent = "本机会话服务暂不可用，请确认预览服务与数据库均已启动。"; serviceError.hidden = false; }
    function setLoading(isLoading) { submitButton.disabled = isLoading; newConversationButton.disabled = isLoading; submitButton.textContent = isLoading ? "正在发送…" : "发送问题"; }
    function requestOptions(body) { return { method: "POST", headers: { "Content-Type": "application/json; charset=UTF-8" }, body: body ? JSON.stringify(body) : undefined }; }
    function streamRequestOptions(body, signal) { return { method: "POST", headers: { "Content-Type": "application/json; charset=UTF-8", "Accept": streamAccept }, body: JSON.stringify(body), signal }; }
    function isEventStream(response) { return (response.headers.get("content-type") || "").includes(streamAccept); }
    // 用户改问或开始新对话时必须掐断上一条流：否则旧流晚到的 accepted/reply 会盖掉新一轮的界面。
    function abortActiveStream() { if (activeStream) { activeStream.abort(); activeStream = null; } }
    // 服务端明确拒绝输入（400）用独立类型区分于"服务不可用"，避免把校验失败说成服务故障。
    class MessageRejectedError extends Error {}
    async function readPayload(response) { try { return await response.json(); } catch (error) { return {}; } }
    function readStoredConversation() { try { return JSON.parse(sessionStorage.getItem(conversationStorageKey)) || {}; } catch (error) { return {}; } }
    function storeConversation(value) { if (value.sessionId) { sessionStorage.setItem(conversationStorageKey, JSON.stringify(value)); } }
    function clearStoredConversation() { sessionStorage.removeItem(conversationStorageKey); }
    function restorePendingClarification() { const stored = readStoredConversation(); if (stored.sessionId && typeof stored.pendingPrompt === "string" && stored.pendingPrompt) { renderClarification(stored.pendingPrompt); } }
</script>
</body>
</html>
