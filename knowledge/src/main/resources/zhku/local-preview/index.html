<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>仲园 Agent｜校园资料问答</title>
    <style>
        :root { color: #193a30; background: #f5f3eb; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        * { box-sizing: border-box; }
        body { margin: 0; }
        .page-shell { width: min(900px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 64px; }
        .hero, .card, .answer-panel { border: 1px solid #d7dfd2; border-radius: 18px; background: #fffef9; box-shadow: 0 12px 34px rgba(25, 58, 48, .07); }
        .hero { padding: 28px 30px; border-top: 4px solid #2d6a4f; }
        .brand-row, .question-actions, .answer-heading, .source-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
        .brand { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: .02em; }
        .local-badge, .coverage-tag, .answer-status { margin: 0; padding: 5px 10px; border-radius: 999px; color: #286044; background: #e8f1e8; font-size: 13px; font-weight: 700; }
        h1 { margin: 22px 0 8px; font-size: clamp(30px, 5vw, 46px); letter-spacing: -.03em; }
        h2 { margin: 0; font-size: 20px; }
        .introduction, .field-hint, .preview-notice, .citation-locator, .coverage-copy { color: #5b675e; line-height: 1.75; }
        .introduction { max-width: 640px; margin: 0; }
        .coverage { display: flex; align-items: flex-start; gap: 12px; margin-top: 22px; padding: 14px 16px; border-radius: 12px; background: #f1f5ee; }
        .coverage-copy { margin: 0; font-size: 14px; }
        .question-card { margin-top: 20px; padding: 24px; }
        label { display: block; margin-bottom: 10px; font-weight: 700; }
        textarea { width: 100%; min-height: 116px; resize: vertical; padding: 14px; border: 1px solid #b8c8b7; border-radius: 11px; color: #193a30; background: #fffef9; font: inherit; line-height: 1.65; }
        textarea:focus-visible, button:focus-visible { outline: 3px solid #b9d4bd; outline-offset: 2px; }
        .field-hint { margin: 10px 0 0; font-size: 14px; }
        .example-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
        .example-question { border: 1px solid #cbdac9; border-radius: 999px; padding: 7px 11px; color: #286044; background: #fffef9; font: inherit; font-size: 14px; cursor: pointer; }
        .example-question:hover { background: #edf5eb; }
        .question-actions { margin-top: 18px; color: #5b675e; font-size: 14px; }
        button { border: 0; border-radius: 10px; padding: 11px 18px; color: #ffffff; background: #1f5941; font: inherit; font-weight: 700; cursor: pointer; }
        button:hover:not(:disabled) { background: #2d7655; }
        button:disabled { cursor: wait; opacity: .72; }
        .message { margin: 16px 0 0; padding: 12px 14px; border-radius: 11px; line-height: 1.6; }
        .question-error, .service-error { color: #8b2f2f; background: #fbedeb; }
        .answer-panel { margin-top: 20px; padding: 24px; }
        .answer-panel[data-mode="INSUFFICIENT_EVIDENCE"] { border-color: #e2d4b9; }
        .answer-panel[data-mode="INSUFFICIENT_EVIDENCE"] .answer-status { color: #7f5524; background: #fbf3e6; }
        .answer-content { margin: 16px 0 0; line-height: 1.9; white-space: pre-wrap; }
        .citation-panel { margin-top: 20px; padding: 16px; border-left: 4px solid #ad6a35; border-radius: 0 11px 11px 0; background: #fcf7f0; }
        .citation-heading { margin: 0; color: #7f4c24; font-size: 15px; }
        .citation-item + .citation-item { margin-top: 13px; }
        .citation-title { margin: 0; color: #193a30; font-weight: 700; }
        .citation-locator { margin: 5px 0 0; font-size: 14px; }
        .preview-notice { margin: 20px 0 0; font-size: 14px; }
        [hidden] { display: none !important; }
        @media (max-width: 560px) { .page-shell { width: min(100% - 24px, 900px); padding-top: 16px; } .hero, .question-card, .answer-panel { padding: 20px; } .brand-row, .question-actions { align-items: flex-start; flex-direction: column; } button[type="submit"] { width: 100%; } }
    </style>
</head>
<body>
<main class="page-shell" aria-labelledby="page-title">
    <header class="hero">
        <div class="brand-row"><p class="brand">仲园 Agent</p><p class="local-badge">本机演示</p></div>
        <h1 id="page-title">校园资料问答</h1>
        <p class="introduction">当前演示“选修课不及格能否重修”与“公共选修课单学期学分上限”。结论只来自已发布且仍有效的资料，不替代学校审批或当期通知。</p>
        <div class="coverage"><span class="coverage-tag">当前资料范围</span><p class="coverage-copy">重修问题未说明公共或专业选修课时，系统会先追问必要信息；学分上限仅说明规则，不判断个人是否还能选课。</p></div>
    </header>
    <section class="card question-card" aria-labelledby="question-title">
        <div class="brand-row"><h2 id="question-title">提出你的问题</h2><button id="new-conversation" type="button">开始新对话</button></div>
        <form id="question-form">
            <label for="question-input">校园问题</label>
            <textarea id="question-input" maxlength="500" placeholder="例如：选修课没及格，还能重修吗？"></textarea>
            <p class="field-hint">输入 1 至 500 个字符。按回车可发送，按 Shift + 回车可换行。</p>
            <div class="example-list" aria-label="示例问题"><span class="field-hint" style="width:100%;margin:0">试试这样问</span><button class="example-question" type="button" data-question="选修课没及格，还能重修吗？">选修课没及格还能重修吗？</button><button class="example-question" type="button" data-question="公共选修课不及格能重修吗？">公共选修课不及格能重修吗？</button><button class="example-question" type="button" data-question="公共选修课每学期最多可以选多少学分？">公共选修课每学期最多可以选多少学分？</button></div>
            <div class="question-actions"><span>会话超时或失效后，请开始新对话。</span><button id="submit-question" type="submit">发送问题</button></div>
            <p id="question-error" class="message question-error" role="alert" hidden></p>
        </form>
    </section>
    <p id="service-error" class="message service-error" role="alert" hidden></p>
    <section id="answer-panel" class="answer-panel" aria-live="polite" hidden>
        <div class="answer-heading"><p id="answer-status" class="answer-status"></p></div>
        <p id="answer-content" class="answer-content"></p>
        <section id="citation-panel" class="citation-panel" aria-labelledby="citation-title" hidden><div class="source-heading"><h2 id="citation-title" class="citation-heading">资料依据</h2><span class="coverage-tag">可追溯</span></div><div id="citation-list"></div></section>
        <p id="preview-notice" class="preview-notice">仅供本机开发验证，请以学校正式通知为准。</p>
    </section>
</main>
<script>
    const conversationApi = "/api/zhku/local-preview/conversations";
    const conversationStorageKey = "zhku.local-preview.conversation";
    const questionForm = document.querySelector("#question-form");
    const questionInput = document.querySelector("#question-input");
    const submitButton = document.querySelector("#submit-question");
    const newConversationButton = document.querySelector("#new-conversation");
    const questionError = document.querySelector("#question-error");
    const serviceError = document.querySelector("#service-error");
    const answerPanel = document.querySelector("#answer-panel");
    const answerStatus = document.querySelector("#answer-status");
    const answerContent = document.querySelector("#answer-content");
    const citationPanel = document.querySelector("#citation-panel");
    const citationList = document.querySelector("#citation-list");
    let sessionId = readStoredConversation().sessionId;
    let requestEpoch = 0;

    restorePendingClarification();
    if (!sessionId) { void createConversationOnLoad(); }
    document.querySelectorAll(".example-question").forEach(button => button.addEventListener("click", () => { questionInput.value = button.dataset.question; questionForm.requestSubmit(); }));
    questionInput.addEventListener("keydown", event => { if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); questionForm.requestSubmit(); } });
    newConversationButton.addEventListener("click", startNewConversation);
    questionForm.addEventListener("submit", sendMessage);

    async function createConversationOnLoad() {
        const expectedEpoch = ++requestEpoch;
        try {
            await ensureConversation(expectedEpoch);
        } catch (error) {
            // 首屏建会话失败不阻塞输入；用户发送时会重试并获得明确的服务错误提示。
            if (expectedEpoch === requestEpoch) { sessionId = null; }
        }
    }

    async function sendMessage(event) {
        event.preventDefault();
        const message = questionInput.value.trim();
        resetMessages();
        if (message.length < 1 || message.length > 500) { showQuestionError("请输入 1 至 500 个字符的问题。"); return; }
        const expectedEpoch = ++requestEpoch;
        setLoading(true);
        try {
            await ensureConversation(expectedEpoch);
            if (expectedEpoch !== requestEpoch) { return; }
            const response = await fetch(`${conversationApi}/${sessionId}/messages`, requestOptions({ message }));
            const payload = await readPayload(response);
            if (expectedEpoch !== requestEpoch) { return; }
            if (!response.ok) { response.status === 400 ? showQuestionError(payload.message || "问题格式不正确，请检查后重试。") : showServiceError(); return; }
            renderReply(payload);
            questionInput.value = "";
        } catch (error) {
            if (expectedEpoch === requestEpoch) { showServiceError(); }
        } finally {
            if (expectedEpoch === requestEpoch) { setLoading(false); }
        }
    }

    async function startNewConversation() {
        const expectedEpoch = ++requestEpoch;
        setLoading(true);
        try {
            const previousSessionId = sessionId;
            clearStoredConversation();
            sessionId = null;
            resetMessages();
            // 新会话必须等待旧会话取消完成，版本令牌同时隔离旧请求的晚到响应。
            if (previousSessionId) {
                const cancellation = await fetch(`${conversationApi}/${previousSessionId}/cancel`, requestOptions());
                if (!cancellation.ok) { throw new Error("conversation-cancel-failed"); }
            }
            if (expectedEpoch !== requestEpoch) { return; }
            await ensureConversation(expectedEpoch);
            if (expectedEpoch === requestEpoch) { renderClarification("已开始新对话。请描述你想确认的选修课重修问题。"); }
        } catch (error) {
            if (expectedEpoch === requestEpoch) { showServiceError(); }
        } finally {
            if (expectedEpoch === requestEpoch) { setLoading(false); }
        }
    }

    async function ensureConversation(expectedEpoch) {
        if (sessionId) { return; }
        const response = await fetch(conversationApi, requestOptions());
        const payload = await readPayload(response);
        if (expectedEpoch !== requestEpoch) { return; }
        if (!response.ok || typeof payload.sessionId !== "string") { throw new Error("conversation-create-failed"); }
        sessionId = payload.sessionId;
        storeConversation({ sessionId, pendingPrompt: null });
    }

    function renderReply(payload) {
        if (payload.type === "NEED_CLARIFICATION") { renderClarification(payload.message); return; }
        if (payload.type === "ANSWER" && isAnswer(payload.answer)) { renderAnswer(payload.answer); return; }
        if (payload.type === "OUT_OF_SCOPE") { renderOutOfScope("网络公共选修课的具体限制暂未纳入本机演示范围，请以当期选课通知为准。"); return; }
        if (payload.type === "EVIDENCE_UNAVAILABLE") { renderOutOfScope("当前没有可确认的有效依据，无法给出确定性结论。"); return; }
        if (payload.type === "SESSION_INVALID" || payload.type === "SESSION_EXPIRED" || payload.type === "SESSION_CANCELLED") {
            sessionId = null;
            clearStoredConversation();
            renderClarification("当前会话已失效，请点击“开始新对话”后重试。");
            return;
        }
        showServiceError();
    }

    function isAnswer(answer) { return answer && typeof answer.conclusion === "string" && typeof answer.basis === "string" && typeof answer.sourceId === "string" && typeof answer.sourceTitle === "string" && typeof answer.sourceVersion === "string" && typeof answer.sourceLocator === "string" && typeof answer.applicableScope === "string"; }
    function renderClarification(message) { answerPanel.dataset.mode = "NEED_CLARIFICATION"; answerStatus.textContent = "需要补充信息"; answerContent.textContent = message; citationList.replaceChildren(); citationPanel.hidden = true; answerPanel.hidden = false; storeConversation({ sessionId, pendingPrompt: message }); }
    function renderOutOfScope(message) { answerPanel.dataset.mode = "OUT_OF_SCOPE"; answerStatus.textContent = "当前范围暂不支持"; answerContent.textContent = message; citationList.replaceChildren(); citationPanel.hidden = true; answerPanel.hidden = false; storeConversation({ sessionId, pendingPrompt: null }); }
    function renderAnswer(answer) { answerPanel.dataset.mode = "ANSWER"; answerStatus.textContent = "结论与资料依据"; answerContent.textContent = `结论：${answer.conclusion}\n\n依据：${answer.basis}\n\n适用范围：${answer.applicableScope}`; citationList.replaceChildren(); appendSource("来源", `${answer.sourceTitle}（${answer.sourceVersion}）`); appendSource("定位", answer.sourceLocator); appendSource("来源编号", answer.sourceId); citationPanel.hidden = false; answerPanel.hidden = false; storeConversation({ sessionId, pendingPrompt: null }); }
    function appendSource(label, value) { const item = document.createElement("article"); item.className = "citation-item"; const title = document.createElement("p"); const locator = document.createElement("p"); title.className = "citation-title"; locator.className = "citation-locator"; title.textContent = label; locator.textContent = value; item.append(title, locator); citationList.append(item); }
    function resetMessages() { questionError.hidden = true; questionError.textContent = ""; serviceError.hidden = true; serviceError.textContent = ""; answerPanel.hidden = true; answerPanel.dataset.mode = ""; citationList.replaceChildren(); }
    function showQuestionError(message) { questionError.textContent = message; questionError.hidden = false; }
    function showServiceError() { serviceError.textContent = "本机会话服务暂不可用，请确认预览服务和数据库均已启动。"; serviceError.hidden = false; }
    function setLoading(isLoading) { submitButton.disabled = isLoading; newConversationButton.disabled = isLoading; submitButton.textContent = isLoading ? "正在发送…" : "发送问题"; }
    function requestOptions(body) { return { method: "POST", headers: { "Content-Type": "application/json; charset=UTF-8" }, body: body ? JSON.stringify(body) : undefined }; }
    async function readPayload(response) { try { return await response.json(); } catch (error) { return {}; } }
    function readStoredConversation() { try { return JSON.parse(sessionStorage.getItem(conversationStorageKey)) || {}; } catch (error) { return {}; } }
    function storeConversation(value) { if (value.sessionId) { sessionStorage.setItem(conversationStorageKey, JSON.stringify(value)); } }
    function clearStoredConversation() { sessionStorage.removeItem(conversationStorageKey); }
    function restorePendingClarification() { const stored = readStoredConversation(); if (stored.sessionId && typeof stored.pendingPrompt === "string" && stored.pendingPrompt) { renderClarification(stored.pendingPrompt); } }
</script>
</body>
</html>
