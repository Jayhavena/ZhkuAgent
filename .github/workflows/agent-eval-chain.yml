name: agent-eval-chain

# 核心业务回归及归档 Grader 重放；选类与执行检查共用版本化清单，防止漏跑假绿。
# 这里刻意不配置数据库、模型或浏览器凭证 —— CI 只验证链路契约，
# 真实执行（RuleAgentOnlineProbeHost）必须由人工在受控环境发起。
on:
  pull_request:
  push:
    branches: [main, feat/zhkuagent-v3-frontend]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-eval-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trial-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 本地试用契约（无数据库及供应商）
        run: |
          mkdir -p "$PWD/target/trial-evidence"
          selector="$(python3 knowledge/scripts/verify_core_regression.py --selector)"
          mvn -B -pl knowledge -am test \
            -Dtest="$selector" \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dzhku.rulecheck.evidenceDir="$PWD/target/trial-evidence"
      - name: 核对所有核心类和21条固定要求均已执行
        if: always()
        run: python3 knowledge/scripts/verify_core_regression.py --reports knowledge/target/surefire-reports --summary target/core-regression-summary.json
      - name: 两轮证据绑定与门禁负例（纯标准库）
        run: |
          python3 -m unittest discover -s knowledge/scripts/tests -p "test_bind_m2_suite.py" -v
          python3 -m unittest discover -s knowledge/scripts/tests -p "test_verify_core_regression.py" -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-regression-summary
          path: target/core-regression-summary.json
          if-no-files-found: error
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: agent/frontend/package-lock.json
      - name: 学生页测试与构建
        working-directory: agent/frontend
        run: |
          npm ci
          node --test tests/*.test.mjs
          npm run build
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 链路回归（归档证据重放，不调模型/数据库）
        run: >
          mvn -B -pl knowledge -am
          -Dtest=AgentEvalChainRegressionTest
          -Dsurefire.failIfNoSpecifiedTests=false
          test

      - name: 生成评测报告
        run: |
          # knowledge 依赖同仓库模块（agent-runtime 等）；干净检出上这些构件
          # 不在本地仓库里，dependency:build-classpath 会解析失败，所以先安装一次。
          mvn -B -q -pl knowledge -am -Dmaven.test.skip=true install
          mvn -B -q -pl knowledge dependency:build-classpath \
            -Dmdep.outputFile=target/cp.txt
          java -cp "knowledge/target/classes:$(cat knowledge/target/cp.txt)" \
            com.zhku.knowledge.eval.chain.AgentEvalChainMain run \
            --suite knowledge/src/test/resources/agent-eval-chain/suite-v1.json \
            --out target/agent-eval-chain-report \
            --repo-root .

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-eval-chain-report
          path: target/agent-eval-chain-report/report.*
          if-no-files-found: warn
