name: agent-eval-chain

# 评测链路回归：用已归档的真实 Agent 证据重放，跑现有 Grader 并产出报告。
# 这里刻意不配置数据库、模型或浏览器凭证 —— CI 只验证链路契约，
# 真实执行（RuleAgentOnlineProbeHost）必须由人工在受控环境发起。
on:
  pull_request:
  push:
    branches: [main, feat/zhkuagent-v3-frontend]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-eval-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trial-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 本地试用契约（无数据库及供应商）
        run: |
          mkdir -p "$PWD/target/trial-evidence"
          mvn -B -pl knowledge -am test \
            -Dtest=RuleCheckPreviewConfigurationTest,RuleCheckCoverageRepairTest,RuleCheckDisabledRetrievalTest,RuleCheckEvidenceFirstTest,HybridRetrievalServiceTest,RulePublicationGateTest,RuleAgentProviderTest,RuleAgentTaskHttpTest,RuleAgentE13PublicationCapabilityTest,PersistentRuleCheckLocalHostTest,PersistentStudentTaskConfigurationTest,RuleAgentSimulatedDemoTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dzhku.rulecheck.evidenceDir="$PWD/target/trial-evidence"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: agent/frontend/package-lock.json
      - name: 学生页测试与构建
        working-directory: agent/frontend
        run: |
          npm ci
          node --test tests/*.test.mjs
          npm run build
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 链路回归（归档证据重放，不调模型/数据库）
        run: >
          mvn -B -pl knowledge -am
          -Dtest=AgentEvalChainRegressionTest
          -Dsurefire.failIfNoSpecifiedTests=false
          test

      - name: 生成评测报告
        run: |
          # knowledge 依赖同仓库模块（agent-runtime 等）；干净检出上这些构件
          # 不在本地仓库里，dependency:build-classpath 会解析失败，所以先安装一次。
          mvn -B -q -pl knowledge -am -Dmaven.test.skip=true install
          mvn -B -q -pl knowledge dependency:build-classpath \
            -Dmdep.outputFile=target/cp.txt
          java -cp "knowledge/target/classes:$(cat knowledge/target/cp.txt)" \
            com.zhku.knowledge.eval.chain.AgentEvalChainMain run \
            --suite knowledge/src/test/resources/agent-eval-chain/suite-v1.json \
            --out target/agent-eval-chain-report \
            --repo-root .

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-eval-chain-report
          path: target/agent-eval-chain-report/report.*
          if-no-files-found: warn
